name: Build and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"   # every Monday, picks up new skins and cases
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - name: Refresh data and compute skin colors
        run: python scripts/build_data.py --colors
      - name: Collect site files
        run: |
          mkdir _site
          cp -r index.html manifest.webmanifest assets data _site/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
